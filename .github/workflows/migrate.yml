name: DB Migration

on:
  push:
    branches: [main]

jobs:
  migrate:
    name: Reset & Seed Supabase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # migrate.py creates missing tables and ensures the dev superuser exists.
      # Existing data is preserved (no drop).
      - name: Create missing tables & ensure superuser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPERUSER_USERNAME: admin
          SUPERUSER_PASSWORD: ceresignal123
        run: python migrate.py

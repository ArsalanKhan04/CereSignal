name: DB Migration

on:
  push:
    branches: [main]

jobs:
  migrate:
    name: Apply Supabase Schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # DATABASE_URL must be the Session Pooler URL (port 5432 on pooler host) — not the
      # direct connection. GitHub Actions is IPv4-only; the direct connection requires IPv6.
      # In Supabase dashboard: Connect → Session pooler → copy the connection string.
      # Format: postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:5432/postgres
      - name: Apply schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python migrate.py

      - name: Ensure dev superuser exists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPERUSER_USERNAME: admin
          SUPERUSER_PASSWORD: ceresignal123
        run: python -m scripts.ensure_superuser

name: DB Migration

# DORMANT — manual dispatch only.
#
# The Supabase project this targeted no longer exists: every run since
# 2026-09-05 failed with `FATAL: (ENOTFOUND) tenant/user postgres.<ref> not
# found`. The push trigger is removed so a dead database stops red-X'ing every
# push to main. Nothing else here is broken.
#
# To re-arm: point the DATABASE_URL secret at a live Postgres URL, then restore
#   push:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Reset & Seed Supabase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # migrate.py creates missing tables and ensures the dev superuser exists.
      # Existing data is preserved (no drop).
      - name: Create missing tables & ensure superuser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPERUSER_USERNAME: admin
          SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: python migrate.py

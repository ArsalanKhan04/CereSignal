name: DB Migration

on:
  push:
    branches: [main]

jobs:
  migrate:
    name: Reset & Seed Supabase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # migrate.py drops all tables, recreates the schema, seeds demo data,
      # and ensures the dev superuser exists — all in one idempotent run.
      - name: Drop, recreate, seed & ensure superuser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPERUSER_USERNAME: admin
          SUPERUSER_PASSWORD: ceresignal123
        run: python migrate.py

# Test suites for pull requests.
#
# Unrelated to migrate.yml and reset-db.yml, which are dormant (manual dispatch
# only, and they fail at the database connection until DATABASE_URL points at a
# live Postgres). This workflow needs no secrets, no database and no network:
# the backend suite builds its own in-memory SQLite database, and neither suite
# requires Redis, a Celery worker or the model weights.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# This workflow reads the repo and nothing else. A default-permissive GITHUB_TOKEN
# on a public repo is what supply-chain attacks reach for.
permissions:
  contents: read

# Supersede in-flight runs for the same PR, but always let pushes to main finish —
# main is the baseline the coverage ratchet is measured against.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Its own job because ruff needs none of the project's dependencies: it installs
  # in ~15s against the backend job's multi-minute install, so the lint verdict
  # arrives first and a lint failure never masks the test result.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          # external/CereProcess and external/full_edf_viewer are submodules and are
          # not ours to lint; pyproject.toml excludes them either way.
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - run: pip install ruff==0.16.7

      - name: Run ruff
        run: ruff check .
        working-directory: backend

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements-ai.txt is deliberately not installed: inference/infer.py imports
      # onnxruntime and openai lazily, and openai is stubbed wherever it is tested.
      # requirements-dev.txt does bring onnxruntime (~15 MB), so test_onnx_inference.py
      # runs the real models. torch is never installed anywhere.
      #
      # requirements.txt is still a pip freeze carrying PyQt5, jupyter and other
      # cruft, so the uncached install is slow. See the plan's follow-ups.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Audits the installed environment (see requirements-dev.txt for why not -r).
      #
      # One ignore, and it is load-bearing rather than convenient:
      #   PYSEC-2026-1325 — ecdsa Minerva P-256 timing attack. No fix exists and
      #   upstream has declined to ship one. ecdsa arrives transitively via
      #   python-jose; app/core/auth.py pins ALGORITHM = "HS256" and decodes with
      #   algorithms=["HS256"], so no ECDSA code path is reachable.
      - name: Audit backend dependencies
        run: |
          pip install --upgrade 'setuptools>=83.0.0'
          pip-audit --strict --ignore-vuln PYSEC-2026-1325

      # --cov activates .coveragerc, which carries the fail_under ratchet. A plain
      # `pytest` stays untraced (and fast) because the floor lives there, not here.
      - name: Run pytest
        run: python -m pytest --cov=app --cov=external --cov=inference --cov-report=term-missing

  frontend:
    name: Frontend (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The npm bundled with Node is not the one lockfiles are written with locally,
      # and npm majors disagree about optional peers: PR #21 failed `npm ci` here on
      # a lockfile that `npm ci` accepted locally. Pin the major to match.
      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # tsc and eslint both need the node_modules installed above, so folding them
      # into this job is free — no second npm ci.
      - name: Type-check
        run: npm run typecheck
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm run test:ci
        working-directory: frontend

  # Browser E2E: a real backend, Celery worker and production frontend build driven
  # by Playwright. Costs nothing: standard runner on a public repo, Redis as a
  # service container, and e2e/stack.sh turns AI, Supabase and email off, so no
  # secret is needed and no paid API is ever called.
  #
  # Not yet a required check on main. Make it one once it has run green for a while.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install npm 12
        run: npm install -g npm@12

      # Base requirements only: AI is off, so onnxruntime and openai are never imported.
      # stack.sh calls backend/cere_env's binaries by path, as every dev script does.
      - name: Install backend
        run: |
          python -m venv backend/cere_env
          backend/cere_env/bin/pip install -r backend/requirements.txt

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.stack/logs/
          retention-days: 7

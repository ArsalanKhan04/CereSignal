version: '3.8'

services:

  # 1. Message Broker (Redis)
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    # Data is temporary for the broker, but you could use a volume here if needed

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend # Path to your FastAPI directory
      dockerfile: Dockerfile.backend
      args:
        # Set INSTALL_AI=false (and AI_INFERENCE_ENABLED=False) for a manual-entry-only stack
        INSTALL_AI: ${INSTALL_AI:-true}
    container_name: fastapi_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 # Your ASGI server command
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_INFERENCE_ENABLED=${AI_INFERENCE_ENABLED:-True}
    depends_on:
      - redis

  # 3. Celery Worker Service
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        INSTALL_AI: ${INSTALL_AI:-true}
    container_name: celery_worker
    command: celery -A inference.infer worker -l info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_INFERENCE_ENABLED=${AI_INFERENCE_ENABLED:-True}
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      - redis
      - backend


  # 4. React Frontend Service (Development Mode) - REVISED
  frontend:
    build:
      context: ./frontend-r
      dockerfile: Dockerfile.dev # Use the simple dev Dockerfile
    container_name: react_frontend
    # Map host port 3000 to container port 3000 (where Node dev server runs)
    ports:
      - "3000:3000"
    # IMPORTANT: Map the local code into the container for live reloading
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents host's node_modules from overriding the container's
    command: npm start # Starts the React development server
    depends_on:
      - backend

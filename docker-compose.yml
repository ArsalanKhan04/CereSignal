version: '3.8'

# Development stack. The backend and worker both bind-mount ./backend, so they
# share one database and one local_storage tree — and the same files the
# scripts/ workflow uses, which makes the two setups interchangeable.
#
# Run ./scripts/setup.sh first: it writes backend/.env, which the containers
# read for SECRET_KEY and the rest. The variables set below override it.

services:

  # 1. Message Broker (Redis)
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    # Data is temporary for the broker, but you could use a volume here if needed

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend # Path to your FastAPI directory
      dockerfile: Dockerfile.backend
      args:
        # Set INSTALL_AI=false (and AI_INFERENCE_ENABLED=False) for a manual-entry-only stack
        INSTALL_AI: ${INSTALL_AI:-true}
    container_name: fastapi_backend
    # Both steps are idempotent, so this is safe on every restart. Mirrors
    # scripts/backend-start.sh, which does the same before serving.
    command: >
      sh -c "python migrate.py &&
             python -m scripts.seed_demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Must stay identical to celery_worker's. Both resolve ./ against WORKDIR
      # /usr/src/app, which the volume below maps to ./backend on the host. Set
      # explicitly because the default in app/core/config.py is Postgres.
      - DATABASE_URL=sqlite:///./cere_signal.db
      - AI_INFERENCE_ENABLED=${AI_INFERENCE_ENABLED:-True}
    volumes:
      # Not just for live reload: the worker resolves the object paths it
      # receives over Redis against its own filesystem, so an upload the API
      # writes is only visible to the worker if both mount the same directory.
      - ./backend:/usr/src/app
    depends_on:
      - redis

  # 3. Celery Worker Service
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        INSTALL_AI: ${INSTALL_AI:-true}
    container_name: celery_worker
    command: celery -A inference.infer worker -l info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./cere_signal.db
      - AI_INFERENCE_ENABLED=${AI_INFERENCE_ENABLED:-True}
      # Optional. Without it the report text is drafted by Ollama on the host, which
      # must listen beyond loopback (OLLAMA_HOST=0.0.0.0) for the container to reach
      # it. If that fails too, inference still completes and the report text is blank.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Empty means the most recently pulled model.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      - redis
      - backend


  # 4. React Frontend Service (Development Mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev # Use the simple dev Dockerfile
    container_name: react_frontend
    # Map host port 3000 to container port 3000 (where Node dev server runs)
    ports:
      - "3000:3000"
    # IMPORTANT: Map the local code into the container for live reloading
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents host's node_modules from overriding the container's
    command: npm run dev # Dev server. `npm start` serves the production build instead.
    depends_on:
      - backend

[pytest]
testpaths = tests

# app.*, external.* and inference.* are top-level packages resolved relative to
# backend/, so pytest must put this directory on sys.path regardless of where it
# was invoked from.
pythonpath = .

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts = -q --strict-markers

# The app's schemas still use Pydantic v1 class-based Config and auth.py still uses
# datetime.utcnow(). Both are pre-existing and out of scope for the test suite; muting
# them here keeps genuinely new warnings visible.
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:mne.*
    ignore:datetime.datetime.utcnow:DeprecationWarning
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
